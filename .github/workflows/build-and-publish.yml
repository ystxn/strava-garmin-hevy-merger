name: Build and publish image

# Build the container image and publish it to GitHub Packages (GHCR) on every
# push to main. Tests must pass first.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the git tag
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so the semver action can find the previous
          # release and compute the next bump from the commits since it.
          fetch-depth: 0

      - name: Compute next semver tag
        id: tag
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          # Conventional-commit messages drive the bump; with none, bump patch.
          noVersionBumpBehavior: patch
          # Re-run with no new commits: keep the current version.
          noNewCommitBehavior: current

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lowercases the image name for GHCR automatically.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.nextStrict }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create and push git tag
        run: |
          git tag "${{ steps.tag.outputs.nextStrict }}"
          git push origin "${{ steps.tag.outputs.nextStrict }}"
